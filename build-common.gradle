version = rootProject.file('../version.txt').text.trim()
group = 'dev.gasharaujo'

base.archivesName = "gashs-behind-click-${platform}-${minecraftVersion}"
java.toolchain.languageVersion = JavaLanguageVersion.of(javaVersion as int)

sourceSets.main.java.srcDir('../common/src/main/java')
sourceSets.main.resources.srcDir('../common/src/main/resources')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources').configure {
    inputs.property 'modVersion', project.version
    filesMatching('META-INF/*.toml') {
        expand modVersion: project.version
    }
}

tasks.withType(Jar).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
